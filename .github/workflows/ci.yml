name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Proxus.Drivers.slnx -c Release
      # Each self-test suite runs even when an earlier one failed, so one run shows every failure.
      - name: Abstractions self-tests
        run: dotnet run --project tests/Proxus.Drivers.Abstractions.SelfTests -c Release --no-build
      - name: Modbus self-tests
        if: success() || failure()
        run: dotnet run --project tests/Proxus.Drivers.Modbus.SelfTests -c Release --no-build
      - name: OPC UA self-tests
        if: success() || failure()
        run: dotnet run --project tests/Proxus.Drivers.OpcUa.SelfTests -c Release --no-build

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack and check
        run: |
          for p in Abstractions Core Modbus OpcUa; do
            dotnet pack src/Proxus.Drivers.$p/Proxus.Drivers.$p.csproj -c Release -o artifacts/nuget
          done
          python3 tools/check_packages.py artifacts/nuget 0.1.0
